<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QR ANJAY GAMPANG</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1a1d23;--mute:#5b6270;--line:#d8dce3;--acc:#1f5fbf;--acc-ink:#fff;--err:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--card:#1d2026;--ink:#eceef2;--mute:#9aa2b1;--line:#333844;--acc:#6ea2f0;--acc-ink:#0d1522;--err:#f2867e}}
:root[data-theme="dark"]{--bg:#14161a;--card:#1d2026;--ink:#eceef2;--mute:#9aa2b1;--line:#333844;--acc:#6ea2f0;--acc-ink:#0d1522;--err:#f2867e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.4rem;margin:0 0 4px}
p.sub{margin:0 0 20px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
label{display:block;font-weight:600;margin:0 0 4px}
.f{margin-bottom:14px}
input,select{width:100%;padding:11px 12px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px}
input{font-family:ui-monospace,Menlo,Consolas,monospace}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.row{grid-template-columns:1fr}}
.hint{font-size:.85rem;color:var(--mute);margin-top:4px}
button{width:100%;padding:13px;font:inherit;font-weight:600;border:0;border-radius:8px;background:var(--acc);color:var(--acc-ink);cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.err{color:var(--err);font-weight:600;margin-top:10px}
.pv{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
#qr{width:140px;height:140px;background:#fff;padding:8px;border-radius:8px;border:1px solid var(--line)}
#qr svg{width:100%;height:100%;display:block}
.txt{flex:1;min-width:180px;overflow-wrap:anywhere;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9rem}
.txt b{font-family:system-ui,sans-serif}
.credit{margin-top:28px;text-align:center;font-size:.75rem;color:var(--mute)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:10px;display:none}
.bar i{display:block;height:100%;width:0;background:var(--acc)}
</style>
</head>
<body>
<main>
<h1>QR ANJAY GAMPANG</h1>
<p class="sub">Isi QR = Kode Awal + Nomor Seri + Kode Akhir, tanpa spasi. Satu QR per halaman PDF.</p>

<div class="card">
  <div class="f"><label for="awal">Kode awal</label>
    <input id="awal" value="S241x" autocomplete="off" autocapitalize="off"></div>
  <div class="row">
    <div class="f"><label for="dari">No seri dari</label>
      <input id="dari" value="0150000064844670" inputmode="numeric" autocomplete="off"></div>
    <div class="f"><label for="sampai">No seri sampai</label>
      <input id="sampai" value="0150000064844699" inputmode="numeric" autocomplete="off"></div>
  </div>
  <div class="hint" style="margin:-6px 0 14px">Angka nol di depan tetap dipertahankan sesuai panjang "No seri dari".</div>
  <div class="f"><label for="akhir">Kode akhir</label>
    <input id="akhir" value="0000082116082863" autocomplete="off"></div>
  <div class="row">
    <div class="f"><label for="ukuran">Ukuran halaman</label>
      <select id="ukuran">
        <option value="a4">A4</option>
        <option value="a5">A5</option>
        <option value="a6">A6</option>
        <option value="label">Label 60 × 70 mm</option>
      </select></div>
    <div class="f"><label for="ecc">Ketahanan QR</label>
      <select id="ecc">
        <option value="L">Rendah (L)</option>
        <option value="M" selected>Sedang (M)</option>
        <option value="Q">Tinggi (Q)</option>
        <option value="H">Sangat tinggi (H)</option>
      </select></div>
  </div>
  <div class="f" style="margin-bottom:0"><label style="display:flex;gap:8px;align-items:center;font-weight:400">
    <input type="checkbox" id="tampilTeks" checked style="width:auto"> Cetak teks kode di bawah QR</label></div>
  <div id="error" class="err" role="alert" hidden></div>
</div>

<div class="card" id="pvCard" hidden>
  <div class="pv">
    <div id="qr" aria-label="Pratinjau QR pertama"></div>
    <div class="txt">
      <div><b>Jumlah QR:</b> <span id="jumlah"></span> halaman</div>
      <div style="margin-top:6px"><b>Pertama:</b><br><span id="pertama"></span></div>
      <div style="margin-top:6px"><b>Terakhir:</b><br><span id="terakhir"></span></div>
    </div>
  </div>
</div>

<button id="btn">Buat &amp; simpan PDF</button>
<div class="bar" id="bar"><i id="fill"></i></div>
<div id="status" class="hint" aria-live="polite"></div>
<div class="credit">Dibuat oleh Muhammad Edwar Taufiq Hidayat</div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
var MAX = 5000;
var $ = function(id){return document.getElementById(id)};
var SIZES = {a4:[210,297], a5:[148,210], a6:[105,148], label:[60,70]};

function build(){
  var awal = $('awal').value.trim(), akhir = $('akhir').value.trim();
  var d = $('dari').value.trim(), s = $('sampai').value.trim();
  if(!awal) return {err:'Kode awal wajib diisi.'};
  if(!akhir) return {err:'Kode akhir wajib diisi.'};
  if(!/^\d+$/.test(d) || !/^\d+$/.test(s)) return {err:'No seri dari dan sampai harus berupa angka.'};
  var a = BigInt(d), b = BigInt(s);
  if(b < a) return {err:'No seri sampai harus lebih besar atau sama dengan No seri dari.'};
  var n = b - a + 1n;
  if(n > BigInt(MAX)) return {err:'Maksimal ' + MAX + ' QR per file. Pecah rentang nomor seri menjadi beberapa file.'};
  var w = d.length, list = [];
  for(var i = a; i <= b; i++){
    var num = i.toString();
    while(num.length < w) num = '0' + num;
    list.push(awal + num + akhir);
  }
  return {list:list};
}

function makeQR(text){
  var q = qrcode(0, $('ecc').value);
  q.addData(text, 'Byte'); q.make();
  return q;
}

function preview(){
  var r = build(), e = $('error');
  if(r.err){ e.textContent = r.err; e.hidden = false; $('pvCard').hidden = true; return null; }
  e.hidden = true;
  var L = r.list;
  $('jumlah').textContent = L.length;
  $('pertama').textContent = L[0];
  $('terakhir').textContent = L[L.length-1];
  $('qr').innerHTML = makeQR(L[0]).createSvgTag({cellSize:4, margin:0, scalable:true});
  $('pvCard').hidden = false;
  return L;
}

['awal','dari','sampai','akhir','ecc'].forEach(function(id){
  $(id).addEventListener('input', preview);
});
preview();

function tick(){ return new Promise(function(r){setTimeout(r,0)}); }

async function makePdf(list){
  var key = $('ukuran').value, sz = SIZES[key];
  var doc = new jspdf.jsPDF({unit:'mm', format:sz, orientation:'portrait'});
  var W = sz[0], H = sz[1], withText = $('tampilTeks').checked;
  var qrSize = Math.min(W, H) * 0.7;
  var x0 = (W - qrSize)/2;
  var y0 = withText ? (H - qrSize)/2 - qrSize*0.06 : (H - qrSize)/2;
  doc.setFont('courier','normal');
  for(var i = 0; i < list.length; i++){
    if(i > 0) doc.addPage(sz, 'portrait');
    var q = makeQR(list[i]), n = q.getModuleCount(), c = qrSize / n;
    doc.setFillColor(0,0,0);
    for(var r = 0; r < n; r++){
      for(var col = 0; col < n; col++){
        if(q.isDark(r, col)) doc.rect(x0 + col*c, y0 + r*c, c + 0.02, c + 0.02, 'F');
      }
    }
    if(withText){
      var fs = 14;
      doc.setFontSize(fs);
      var maxW = W * 0.9;
      while(doc.getTextWidth(list[i]) > maxW && fs > 4){ fs -= 0.5; doc.setFontSize(fs); }
      doc.setTextColor(0,0,0);
      doc.text(list[i], W/2, y0 + qrSize + qrSize*0.09, {align:'center'});
    }
    if(i % 25 === 0){
      var p = Math.round((i+1)/list.length*100);
      $('fill').style.width = p + '%';
      $('status').textContent = 'Membuat halaman ' + (i+1) + ' dari ' + list.length + '…';
      await tick();
    }
  }
  $('fill').style.width = '100%';
  return doc.output('blob');
}

$('btn').addEventListener('click', async function(){
  var L = preview();
  if(!L) return;
  var btn = $('btn');
  btn.disabled = true;
  $('bar').style.display = 'block'; $('fill').style.width = '0';
  try{
    var blob = await makePdf(L);
    var name = 'qr-' + L[0] + '_sd_' + L[L.length-1].slice($('awal').value.trim().length, -$('akhir').value.trim().length) + '.pdf';
    if(name.length > 120) name = 'qr-kode.pdf';
    var dl = null;
    try{ dl = (window.claude && claude.use) ? await claude.use('downloads') : null; }catch(_){ dl = null; }
    if(dl){
      $('status').textContent = 'PDF siap. Konfirmasi penyimpanan…';
      try{
        await dl.save({filename:name, data:blob});
        $('status').textContent = 'Tersimpan: ' + L.length + ' halaman.';
      }catch(err){
        $('status').textContent = err && err.code === 'declined' ? 'Penyimpanan dibatalkan.' : 'Gagal menyimpan: ' + (err && err.message || 'tidak diketahui');
      }
    }else{
      var u = URL.createObjectURL(blob), el = document.createElement('a'); el.href = u; el.download = name; document.body.appendChild(el); el.click(); el.remove(); setTimeout(function(){URL.revokeObjectURL(u)}, 4000); $('status').textContent = 'PDF diunduh: ' + L.length + ' halaman.';
    }
  }catch(err){
    $('status').textContent = 'Terjadi kesalahan: ' + (err && err.message || err);
  }finally{
    btn.disabled = false;
    setTimeout(function(){ $('bar').style.display = 'none'; }, 800);
  }
});
})();
</script>
</body>
</html>
